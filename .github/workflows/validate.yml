name: validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: JSON manifests are valid
        run: |
          for f in plugins/overseer/.claude-plugin/plugin.json plugins/overseer/.codex-plugin/plugin.json plugins/overseer/hooks/hooks.json; do
            echo "jq: $f"; jq empty "$f"
          done

      - name: plugin manifest versions agree
        run: |
          pv=$(jq -r .version plugins/overseer/.claude-plugin/plugin.json)
          cv=$(jq -r .version plugins/overseer/.codex-plugin/plugin.json)
          echo "claude=$pv codex=$cv"
          test -n "$pv" && test "$pv" = "$cv"

      - name: product repository is not a marketplace
        run: |
          test ! -e .claude-plugin/marketplace.json
          test ! -e .agents/plugins/marketplace.json
          test "$(jq -r .skills plugins/overseer/.codex-plugin/plugin.json)" = "./skills/"

      - name: generated development marketplace validates
        run: |
          python3 tests/make-dev-marketplace.py
          jq empty .tmp/dev-marketplace/.claude-plugin/marketplace.json
          jq empty .tmp/dev-marketplace/.agents/plugins/marketplace.json

      - name: product release is isolated from catalog-only changes
        if: github.event_name == 'pull_request'
        run: python3 tests/check-release-isolation.py --base-ref "origin/${{ github.base_ref }}"

      - name: a version bump must bring a CHANGELOG entry
        if: github.event_name == 'pull_request'
        run: |
          pv=$(jq -r .version plugins/overseer/.claude-plugin/plugin.json)
          base=""
          for p in plugins/overseer/.claude-plugin/plugin.json overseer/.claude-plugin/plugin.json; do
            if raw=$(git show "origin/${{ github.base_ref }}:$p" 2>/dev/null); then
              base=$(printf '%s' "$raw" | jq -r '.version // empty')
              if [ -n "$base" ]; then break; fi
            fi
          done
          if [ -z "$base" ]; then
            echo "no baseline plugin.json on origin/${{ github.base_ref }} — skipping"
          elif [ "$pv" = "$base" ]; then
            echo "version unchanged ($pv) — no CHANGELOG entry required"
          elif grep -q "^## \[$pv\]" CHANGELOG.md; then
            echo "ok: $base -> $pv is documented under '## [$pv]'"
          else
            echo "::error::version bumped $base -> $pv but CHANGELOG.md has no '## [$pv]' heading"
            exit 1
          fi

      - name: shell scripts parse and lint
        run: |
          for f in plugins/overseer/skills/overseer/scripts/overseer \
                   plugins/overseer/skills/overseer/scripts/lib/*.sh \
                   plugins/overseer/hooks/turn-done.sh \
                   tests/run.sh \
                   tests/win-flow.sh \
                   tests/win-payloads.sh \
                   tests/stress.sh; do
            bash -n "$f"
          done
          shellcheck -x -S warning plugins/overseer/skills/overseer/scripts/overseer
          shellcheck -S warning plugins/overseer/hooks/turn-done.sh
          shellcheck -S warning tests/run.sh
          shellcheck -S warning tests/win-flow.sh
          shellcheck -S warning tests/win-payloads.sh
          shellcheck -S warning tests/stress.sh

      - name: parser fixture tests
        run: bash tests/run.sh

      - name: windows flow tests
        run: bash tests/win-flow.sh

      - name: Windows payload contracts on PowerShell/Linux
        run: bash tests/win-payloads.sh

  powershell:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Windows payloads parse
        shell: pwsh
        run: ./tests/win-parse.ps1

      - name: Windows payload contracts
        shell: pwsh
        run: ./tests/win-contracts.ps1

  stress:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: install tmux
        run: sudo apt-get update && sudo apt-get install -y tmux

      - name: harness-free stress subset
        timeout-minutes: 5
        env:
          OVERSEER_STRESS_NO_PERF: "1"
        run: bash tests/stress.sh

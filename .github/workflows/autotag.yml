name: autotag

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  autotag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: tag and release the plugin version if it is new
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pv=$(jq -r .version plugins/overseer/.claude-plugin/plugin.json)
          cv=$(jq -r .version plugins/overseer/.codex-plugin/plugin.json)
          if [ "$pv" != "$cv" ]; then
            echo "::error::claude plugin ($pv) and codex plugin ($cv) disagree — refusing to tag"
            exit 1
          fi
          previous=$(git tag --list 'overseer--v*' --sort=-v:refname | head -n1)
          if [ -n "$previous" ]; then
            python3 tests/check-release-isolation.py --base-ref "$previous"
          fi
          tag="overseer--v$pv"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "$tag already exists"
          else
            git tag "$tag"
            git push origin "$tag"
            echo "tagged $tag"
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "release $tag already published"
          else
            gh release create "$tag" --generate-notes --latest --verify-tag
            echo "released $tag"
          fi
          release_sha=$(git rev-parse "$tag^{commit}")
          git fetch origin plugin-release:refs/remotes/origin/plugin-release || true
          if git rev-parse --verify refs/remotes/origin/plugin-release >/dev/null 2>&1; then
            git merge-base --is-ancestor refs/remotes/origin/plugin-release "$release_sha"
          fi
          git push origin "$release_sha:refs/heads/plugin-release"
          echo "published plugin-release at $release_sha"
